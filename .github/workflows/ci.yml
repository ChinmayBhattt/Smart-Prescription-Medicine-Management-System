name: SmartRx CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. Backend Validation & Test Job (Go 1.22+)
  # ========================================================
  backend:
    name: Backend (Go Native) - Vet, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.mod

      - name: Verify Go Dependencies
        run: go mod verify

      - name: Run Go Code Analysis (Vet)
        run: go vet ./...

      - name: Run Clinical Safety & Unit Tests
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Compile Backend Server Binary
        run: go build -v -o server .

  # ========================================================
  # 2. Frontend Validation & Build Job (React 19 + TypeScript)
  # ========================================================
  frontend:
    name: Frontend (React + Vite) - Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Clean Install NPM Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Run TypeScript Verification & Production Build
        run: npm run build

      - name: Upload Production Web Assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
